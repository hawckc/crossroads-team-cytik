<!DOCTYPE html>
<html lang="en" data-demo-host>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Commit — Stay Accountable</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a2f2c,#101312);overflow:hidden;font-family:system-ui,sans-serif}
.stage{--h:min(844px,calc(100vh - 100px));position:relative;margin-top:50px;height:var(--h);aspect-ratio:390/844;max-width:calc(100vw - 20px)}
.phone{position:relative;width:100%;height:100%;padding:12px;border-radius:56px;background:#0a0a0a;box-shadow:0 0 0 2px #3a3d3b,0 0 0 5px #151716,0 30px 80px rgba(0,0,0,.6)}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#000}
.screen iframe{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <iframe src="index.html?embed=1" title="Commit app" allow="camera; microphone; geolocation; clipboard-write"></iframe>
    </div>
  </div>
</div>
<script>/* ?api=1 turns the backend on and ?api=0 off for the app in the frame (same origin, same tab storage) */try{var q=new URLSearchParams(location.search).get("api");if(q==="1")sessionStorage.setItem("commit_api","1");else if(q==="0")sessionStorage.removeItem("commit_api")}catch(e){}</script>
<script src="js/demo.js"></script>
</body>
</html>
